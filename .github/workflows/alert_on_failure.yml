name: Failure Alert System

on:
  workflow_run:
    workflows: ["Run Farm Receipt Processor"]
    types:
      - completed

jobs:
  send-sms-alert:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    # This explicitly permits the workflow runner to look up environment details
    permissions:
      actions: read
      contents: read
    steps:
    - name: Send Text Message Notification
      uses: dawidd6/action-send-mail@v4
      with:
        server_address: smtp.gmail.com
        server_port: 465
        secure: true
        username: ${{ secrets.EMAIL_USER }}
        password: ${{ secrets.EMAIL_PASS }}
        to: ${{ secrets.NOTIFICATION_PHONE_GATEWAY }}
        from: "Farm Bot Alert"
        subject: "test"
        body: "test"
