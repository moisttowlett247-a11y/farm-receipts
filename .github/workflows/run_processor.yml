name: Process and Organize Farm Receipts

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  process-and-organize:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Virtual Environment
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: ~/.venv
          key: ${{ runner.os }}-venv-${{ hashFiles('**/requirements.txt') }}

      - name: Create and Activate Virtual Environment
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv ~/.venv
          source ~/.venv/bin/activate
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Receipt Ingestion Processor
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          TRUSTED_SENDERS: ${{ secrets.TRUSTED_SENDERS }}
        run: |
          source ~/.venv/bin/activate
          python farm_receipt_processor.py

      - name: Sort Receipts Chronologically
        run: |
          source ~/.venv/bin/activate
          python receipt_organizer.py

      - name: Commit and Push Updated Receipt Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Receipt_Data.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Process and chronologically sort receipts" && git push)
