name: Process and Organize Farm Receipts

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  process-and-organize:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Receipt Ingestion Processor
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          IMAP_SERVER: ${{ secrets.IMAP_SERVER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python farm_receipt_processor.py

      - name: Sort and Deduplicate Receipts
        run: python receipt_organizer.py

      - name: Consolidate Receipt Items
        run: python item_consolidator.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Receipt_Data.txt
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update, sort, and consolidate receipt data [skip ci]"
            git push
          fi
